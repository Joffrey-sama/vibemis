name: Docker Kiosk Image

on:
  pull_request:
    branches:
      - vibemis-main
    paths:
      - "docker/**"
      - ".github/workflows/docker-kiosk.yml"
  push:
    branches:
      - vibemis-main
    paths:
      - "docker/**"
      - ".github/workflows/docker-kiosk.yml"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-kiosk.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-kiosk.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Strict SemVer tag to publish (e.g. 0.6.0-kiosk.1)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vibemis

jobs:
  docker-kiosk:
    name: Build, Self-Test & Publish Kiosk Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build local image for self-test
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vibemis-kiosk:self-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container self-test
        run: docker run --rm vibemis-kiosk:self-test --self-test

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SemVer image to GHCR
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
